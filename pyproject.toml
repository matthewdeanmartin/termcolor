[project]
name = "termcolor-whl"
version = "1.1.3"
description = "ANSI Color formatting for output in terminal, fork of termcolor, maintained as of 2023 by Matthew Martin"
readme = "README.md"
requires-python = ">=2.6"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Konstantin Lepa", email = "konstantin.lepa@gmail.com"},
    {name = "Matthew Martin", email = "matthewdeanmartin@gmail.com"},
]
keywords = ["terminals", "ansi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Terminals",
    "Programming Language :: Python",
    "Programming Language :: Python :: 2.6",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://matthewdeanmartin.github.io/termcolor/"
Repository = "https://github.com/matthewdeanmartin/termcolor"
Documentation = "https://termcolor-whl.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/matthewdeanmartin/termcolor/issues"
"Change Log" = "https://github.com/matthewdeanmartin/termcolor/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "tox>=4",
    "flake8>=7",
    "pylint>=3",
    "mypy>=1.8",
    "check-wheel-contents>=0.6",
    "twine>=6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["termcolor"]

[tool.hatch.build.targets.sdist]
include = ["termcolor", "README.md", "LICENSE", "CHANGELOG.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.uv]
environments = ["python_version >= '3.11'"]

[tool.changelogmanager.versioning]
scheme = "semver"

[tool.changelogmanager.validation]
format = "auto"

[[tool.changelogmanager.components]]
name = "default"
changelog = "CHANGELOG.md"
version_files = ["pyproject.toml"]
